<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LenBot · 首次配置</title>
<style>
:root{font:16px/1.65 system-ui,sans-serif;color:#192b43;background:#f4f6fa}body{max-width:880px;margin:40px auto;padding:0 20px}h1{font-size:30px;margin-bottom:6px}p{color:#536177}fieldset{background:white;border:1px solid #dce2ed;border-radius:12px;padding:24px;margin:22px 0}legend{font-weight:650;padding:0 8px}label{display:block;margin:14px 0 4px}input,select,textarea,button{font:inherit;box-sizing:border-box;border-radius:6px;border:1px solid #8b99ae;padding:10px;width:100%;min-height:44px}textarea{min-height:100px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8bafff;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}button{background:#315ddd;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:14px;color:#536177}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:18px;border-radius:8px}#error{color:#a52222}#result{border:1px solid #3d8762}@media(max-width:600px){.grid{grid-template-columns:1fr}fieldset{padding:16px}body{margin:20px auto}}[hidden]{display:none!important}
</style>
<h1>让 LenBot 开始工作</h1><p>填完这一页并保存，再用 <code>uv run len-bot</code> 启动就能用了。已有的配置和角色不会被覆盖。</p>
<form id="setup">
<fieldset><legend>1 · 连接 QQ</legend><div class="grid"><div><label for="bot">Bot 的 QQ</label><input id="bot" required pattern="[1-9][0-9]*" inputmode="numeric"></div><div><label for="owner">主人 QQ（选填）</label><input id="owner" pattern="[1-9][0-9]*" inputmode="numeric"></div></div>
<label for="zone">时区</label><input id="zone" required value="Asia/Shanghai"><label for="transport">OneBot 连接方式</label><select id="transport"><option value="forward_ws">LenBot 去连 OneBot（正向 WebSocket）</option><option value="reverse_ws">OneBot 来连 LenBot（反向 WebSocket）</option></select>
<div id="forward"><label for="ws">OneBot WebSocket 地址</label><input id="ws" type="url" placeholder="ws://127.0.0.1:3001" required></div><div id="reverse" hidden><label for="listen">监听地址</label><input id="listen" value="127.0.0.1"><label for="wsport">监听端口</label><input id="wsport" type="number" min="1" max="65535" value="8080"></div>
<label for="access">OneBot 访问令牌（选填）</label><input id="access" type="password" autocomplete="off"><label for="delivery">回复怎么发</label><select id="delivery"><option value="simulated">模拟发送：照常收消息、想回复，但不发到 QQ</option><option value="onebot">真的发到 QQ</option></select><p class="hint">第一次用建议先选模拟发送。也可以先不连 QQ，直接在面板的对话测试里聊。</p>
</fieldset>
<fieldset><legend>2 · 选择模型</legend><p class="hint">先填一个兼容 OpenAI 聊天接口的服务商，之后可以在面板的模型页给不同用途换模型。模型名和上下文窗口照服务商文档填。</p><label for="base">接口地址（API Base URL）</label><input id="base" type="url" placeholder="https://your-provider.example/v1" required><label for="key">API Key</label><input id="key" type="password" autocomplete="off" required>
<div class="grid"><div><label for="mind">大脑模型（决定要不要回、回什么）</label><input id="mind" required><label for="mindwindow">大脑模型的上下文窗口（token）</label><input id="mindwindow" type="number" min="2048" required></div><div><label for="voice">表达模型（把回复写成角色的口吻）</label><input id="voice" required><label for="voicewindow">表达模型的上下文窗口（token）</label><input id="voicewindow" type="number" min="2048" required></div></div><label for="output">每次最多输出（token）</label><input id="output" type="number" min="1" value="1024" required>
</fieldset>
<fieldset><legend>3 · 角色与第一个场景</legend><div class="grid"><div><label for="roleid">角色文件夹名（小写英文、数字和 -）</label><input id="roleid" value="my-bot" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></div><div><label for="name">角色名字</label><input id="name" required></div></div><label for="brief">它是什么样的人</label><textarea id="brief" required placeholder="身份、性格、做事方式"></textarea><label for="voicetext">它怎么说话</label><textarea id="voicetext" required placeholder="语气、用词、回复长短"></textarea><label for="bounds">底线（选填）</label><textarea id="bounds" placeholder="它不会做、不会说的事"></textarea>
<div class="grid"><div><label for="kind">先在哪里聊</label><select id="kind"><option value="group">群聊</option><option value="private">私聊</option></select></div><div><label for="scene">群号或私聊对方 QQ</label><input id="scene" required pattern="[1-9][0-9]*" inputmode="numeric"></div></div><p class="hint">在群里，只有 @ Bot 或回复 Bot 的消息它才会回；私聊每条都回。其他群、记忆、插件这些之后在面板里加。</p>
</fieldset>
<fieldset><legend>4 · 面板登录</legend><label for="username">面板用户名</label><input id="username" required autocomplete="username"><label for="password">面板密码（至少 8 位）</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="port">面板端口</label><input id="port" type="number" min="1" max="65535" value="8088" required><p class="hint">面板只能在这台电脑上打开。</p></fieldset>
<button id="save" type="submit">保存配置</button></form><pre id="error" role="alert" hidden></pre><pre id="result" role="status" hidden></pre>
<script>
const $=id=>document.getElementById(id),value=id=>$(id).value;
const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);
if(!token){$('error').hidden=false;$('error').textContent='链接不完整，请打开启动时终端里显示的完整链接。';$('save').disabled=true}
$('transport').onchange=()=>{const forward=value('transport')==='forward_ws';$('forward').hidden=!forward;$('reverse').hidden=forward;$('ws').required=forward};
$('setup').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('error').hidden=true;
const binding=(model,window)=>({provider:'primary',model:value(model),context_window_tokens:Number(value(window)),max_output_tokens:Number(value('output'))});
const onebot=value('transport')==='forward_ws'?{mode:'forward_ws',ws_url:value('ws')}:{mode:'reverse_ws',listen_host:value('listen'),listen_port:Number(value('wsport'))};if(value('access'))onebot.access_token=value('access');
const body={bot_qq:value('bot'),owner_qq:value('owner')||null,timezone:value('zone'),delivery:value('delivery'),onebot,provider:{api:'openai-chat',base_url:value('base'),api_key:value('key')},mind:binding('mind','mindwindow'),voice:binding('voice','voicewindow'),scene:value('kind')+':'+value('scene'),persona_id:value('roleid'),persona_name:value('name'),brief:value('brief'),voice_text:value('voicetext'),boundaries:value('bounds'),panel_port:Number(value('port')),username:value('username'),password:value('password')};
try{const response=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:JSON.stringify(result.detail));$('setup').hidden=true;$('result').hidden=false;$('result').textContent=`已保存。\n${result.next}\n面板地址：${result.panel_url}\n回复：${result.delivery==='simulated'?'模拟发送':'发到 QQ'}\n配置文件：${result.config}\n角色：${result.persona}`}
catch(error){$('error').hidden=false;$('error').textContent='没有保存成功：'+error.message;$('save').disabled=false}}
</script></html>
