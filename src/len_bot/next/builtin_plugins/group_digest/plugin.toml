name = "group_digest"
version = "1.0.0"
interface = 1
requires_lenbot = ">=0.1,<1"
requires_python = ">=3.13"
platforms = ["linux", "darwin", "win32"]
reload = "plugin"
authors = ["LEN5010"]
license = "AGPL-3.0-only"
description = "/群总结 显式单次生成；/群工作 按真实发送者委派文件或长工作。不是每条聊天自动调用。"

[config.message_limit]
type = "integer"
description = "总结或委派时读取的最近消息条数"
minimum = 1
maximum = 100
default = 50

[config.model_role]
type = "string"
description = "群总结使用的已有模型用途绑定"
options = ["mind", "learner"]
default = "mind"
