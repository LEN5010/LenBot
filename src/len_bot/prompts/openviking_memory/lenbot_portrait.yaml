memory_type: lenbot_portrait
description: |
  整理当前来源中的稳定事实、偏好、常用称呼和人与人的实际关系。
  以原消息的真实QQ和名字区分人：peer上下文记录该参与者，场景上下文记录群体资料并逐项注明涉及的人。
  保留说话者、实际确认时间与明确的不确定性；不同人的喜好分别记录，个人偏好保持个人范围。
  已有未被新消息涉及的有效内容继续保留；出现更正或变化时带上新旧说法各自的时间与来源，呈现变化而非抹掉旧依据。
directory: "viking://user/{{ user_space }}/memories/lenbot"
filename_template: portrait.md
enabled: true
stage: user
peer_enabled: true
operation_mode: upsert
content_template: "{{ content }}"
embedding_template: "{{ content }}"
fields:
  - name: content
    type: string
    merge_op: patch
    description: |
      完整Markdown正文。按实际人物或场景主题分节，记录真实QQ、来源说法、已提供的日期和变化。
      事实、喜好、关系说明和尚待确认的说法分别呈现；正文清楚表达是谁说了什么，而不是替原话提供真实性担保。
