memory_type: lenbot_commitments
description: |
  整理此来源中的实际承诺：谁答应了谁、具体答应什么、原话和当时约定的时间。
  提议、明确答应、进行中、实际完成、撤销、修改和结果未知分别描述；后来消息有进展时保留原约定并追加具体变化。
  群友承诺和助手承诺各自归属真实发言者，按具体事项组织，保持未被本批次涉及的未结束事项。
directory: "viking://user/{{ user_space }}/memories/lenbot"
filename_template: commitments.md
enabled: true
stage: user
peer_enabled: false
operation_mode: upsert
content_template: "{{ content }}"
embedding_template: "{{ content }}"
fields:
  - name: content
    type: string
    merge_op: patch
    description: |
      完整Markdown承诺记录，包含实际请求人与承诺者、具体事项、原有时间和来源说法。
      兑现仅据后续明确结果描述；记录承诺是记忆整理，不代表创建了定时安排、执行任务或平台已接收交付物。
