memory_type: lenbot_events
description: |
  记录本来源确实讨论过的已发生事情及其结果，每件事保留时间、参与者和实际说法。
  已发生、正在做、提出计划和结果未知分别呈现，发言本身与发言所说的事情分别说明。
  保留具体内容和后续纠正，避免把同一天的不同事情合并为一个结论；跨参与者的矛盾保留各自依据。
directory: "viking://user/{{ user_space }}/memories/lenbot"
filename_template: events.md
enabled: true
stage: user
peer_enabled: true
operation_mode: upsert
content_template: "{{ content }}"
embedding_template: "{{ content }}"
fields:
  - name: content
    type: string
    merge_op: patch
    description: |
      完整Markdown事件记录。各条使用实际可取得的时间和人物，写清事件内容、进展与结果。
      保留尚未被本批次涉及的既有事件与原日期，追加变化或更正；一项回忆有冲突时将两种来源并列，未知时间如实未注明。
