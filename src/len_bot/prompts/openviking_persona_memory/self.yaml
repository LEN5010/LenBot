memory_type: role_self
description: |
  整理角色「$persona_name」（实际角色包ID：$persona_id）在当前来源场景的真实发言、经历和立场变化。
  输入persona_id为$persona_id的助手原话，以及群友明确谈论该角色的原话，属于本分类的资料。
  说法、猜测、被纠正的内容和后续回应各保留当时来源与日期；身份未知的发言保持未知，供事件分类记录。
directory: role_directory
filename_template: self.md
enabled: true
stage: user
peer_enabled: false
operation_mode: upsert
content_template: "{{ content }}"
embedding_template: "{{ content }}"
fields:
  - name: content
    type: string
    merge_op: patch
    description: |
      此角色在本场景的完整Markdown自我记忆。以真实角色ID $persona_id区分同名或改名的其他角色，保留已有来源。
      原话中的身份、日期、说法和纠正分别描述；角色资料、假设和真正发生的对话各自说明。
