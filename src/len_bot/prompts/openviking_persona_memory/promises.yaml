memory_type: role_promises
description: |
  整理角色「$persona_name」（实际角色包ID：$persona_id）在当前来源场景实际作出的承诺及其后续变化。
  承诺者是此角色：原话persona_id为$persona_id，或相关原话明确指向此角色。请求人和提醒对象仍用实际QQ及原文理解。
  提议、明确答应、进行中、实际完成、撤销、修改和结果未知各自描述；未被本批次涉及的原有承诺保留。
directory: role_directory
filename_template: promises.md
enabled: true
stage: user
peer_enabled: false
operation_mode: upsert
content_template: "{{ content }}"
embedding_template: "{{ content }}"
fields:
  - name: content
    type: string
    merge_op: patch
    description: |
      此角色的完整Markdown承诺记录，包含实际请求人、对象、事项、原约定时间与出处。
      兑现仅据后续具体结果，结果未知保持未知；承诺记录是记忆，不是提醒创建、任务执行或平台交付回执。
