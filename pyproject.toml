[project]
name = "len-bot"
version = "0.1.0"
description = "QQ group-chat bot with tool calls, background work, and an operator dashboard"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "LEN5010", email = "1649211052@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "websockets>=17.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "trafilatura>=2.2.0",
    "pillow>=11.0",
    "pypdfium2>=5,<6",
    "pyyaml>=6.0.3",
    "regex>=2026.9.3",
    "sqlite-vec>=0.1.9",
    "mcp==2.2.0",
    "httpx2>=2.5,<3",
    "jsonschema>=4.20,<5",
    "referencing>=0.35,<1",
    "anyio>=4.9,<5",
]

[project.scripts]
len-bot = "len_bot:main"
lenbot-eval = "len_bot.eval.replay:main"

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

# The source distribution includes panel sources and deployment recipes;
# the wheel contains runtime code and the built panel, not its build tools.
[tool.uv.build-backend]
source-include = [".github/**", "uv.lock", ".dockerignore", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md", "scripts/**", "docker/**", "deploy/**", "developer/**"]
source-exclude = ["src/len_bot/web/frontend/node_modules", "**/__pycache__", "**/*.pyc", "**/.lenbot-instance.lock"]
wheel-exclude = [
    "**/.lenbot-instance.lock",
    "/src/len_bot/web/frontend/**",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
