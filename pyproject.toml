[project]
name = "len-bot"
version = "0.1.0"
description = "QQ group-chat bot with tool calls, background work, and an operator dashboard"
readme = "README.md"
authors = [
    { name = "LEN5010", email = "1649211052@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "websockets>=17.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "trafilatura>=2.2.0",
    "pillow>=11.0",
    "pypdfium2>=5,<6",
    "jinja2>=3.1.4",
    "qrcode>=8.2",
]

[project.scripts]
len-bot = "len_bot:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.62.0",
]

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

# The wheel ships the built control panel (web/static/dist), not its build
# toolchain. The source distribution keeps the frontend sources and lockfile
# so the panel can be rebuilt, while omitting local installed dependencies.
[tool.uv.build-backend]
source-exclude = ["src/len_bot/web/frontend/node_modules"]
wheel-exclude = ["web/frontend"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
