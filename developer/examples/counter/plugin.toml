name = "counter"
version = "1.1.0"
interface = 1
requires_lenbot = ">=0.2,<1"
requires_python = ">=3.13"
platforms = ["linux", "darwin", "win32"]
reload = "plugin"
authors = ["LEN5010"]
license = "GPL-3.0-only"
description = "每群独立计数：命令直接回复、只读 JSON 查询、按需后台模型说明与自行发送。"

[model]
instructions = "prompts/tools.md"

[config.label]
type = "string"
label = "显示名称"
description = "计数的显示名称"
default = "本群计数"

[config.step]
type = "integer"
label = "每次增加"
description = "发送「计数加一」时增加的数值"
minimum = 1
maximum = 100
default = 1

[config.format]
type = "string"
label = "回复样式"
description = "详细样式会附上步长和用法"
options = [{ value = "compact", label = "简洁" }, { value = "detail", label = "详细" }]
default = "compact"
