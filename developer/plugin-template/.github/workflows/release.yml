name: Plugin ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin
        run: zip -r "counter-${GITHUB_REF_NAME}.zip" plugin.toml __init__.py README.md README.en.md LICENSE
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "counter-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes
