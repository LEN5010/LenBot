services:
  embeddings:
    image: ollama/ollama:0.35.0
    container_name: lenbot-embeddings
    restart: 'no'
    ports:
    - 127.0.0.1:11434:11434
    volumes:
    - ../../state/services/embeddings:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    cpus: 2
    mem_limit: 3g
    pids_limit: 256
  openviking:
    image: lenbot-openviking:a09a9d2
    container_name: lenbot-openviking
    restart: 'no'
    ports:
    - 127.0.0.1:1933:1933
    volumes:
    - ../../state/services/openviking:/service
    user: '501:20'
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    depends_on:
    - embeddings
