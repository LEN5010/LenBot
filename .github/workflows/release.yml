name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push versioned images and create a Release (requires the matching existing tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  packages:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dockerhub: ${{ steps.version.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the one release version
        id: version
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          uv python install 3.13
          uv run --no-project --python 3.13 python - <<'PY'
          import os, re, tomllib
          from scripts.release_metadata import release_version
          from pathlib import Path
          version = release_version(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          publish = os.environ['PUBLISH'] == 'true'
          if publish and not os.environ['DOCKERHUB_NAMESPACE']:
              raise ValueError('Set the Docker Hub namespace before publishing')
          if publish and os.environ['GITHUB_REF'] != 'refs/tags/v' + version:
              raise ValueError('Publishing requires the checked-out tag v' + version)
          # The notes become the Release body as they are; a draft is never published.
          note_file = Path('changelogs') / f'v{version}.md'
          if not note_file.exists():
              note_file = Path('deploy/release-notes.md')
          notes = note_file.read_text()
          if publish and (not notes.startswith(f'# LenBot {version}\n') or '（发布时填写' in notes):
              raise ValueError(f'deploy/release-notes.md must start with "# LenBot {version}" and keep no （发布时填写 placeholder')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nimage=ghcr.io/{os.environ["GITHUB_REPOSITORY"].lower()}\npublish={str(publish).lower()}\n')
              output.write(f'prerelease={str(bool(re.search(r"(a|b|rc)\d+$", version))).lower()}\ndockerhub=docker.io/{os.environ["DOCKERHUB_NAMESPACE"]}/lenbot\n')
          PY
      - name: Refuse an already published version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/existing-tags"
          python3 - <<'PY'
          import os
          from pathlib import Path
          tags = Path(os.environ['RUNNER_TEMP'], 'existing-tags').read_text().splitlines()
          if 'v' + os.environ['VERSION'] in tags:
              raise ValueError('This Release already exists; do not rebuild or overwrite its version')
          PY
      - name: Build corresponding packages and deployment bundles
        run: uv run --no-project --python 3.13 python scripts/build_release.py "$RUNNER_TEMP/release"
      - name: Include the exact patched component sources
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for component in browserskill; do
            uv run --no-project --python 3.13 python scripts/prepare_component.py "$component" "$RUNNER_TEMP/$component" \
              --source-archive "$RUNNER_TEMP/release/artifacts/$component-$VERSION-source.tar.gz"
          done
          cp deploy/components.json "$RUNNER_TEMP/release/artifacts/components.json"
          notes="changelogs/v$VERSION.md"
          if [ ! -f "$notes" ]; then notes=deploy/release-notes.md; fi
          cp "$notes" "$RUNNER_TEMP/release/artifacts/release-notes.md"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release/artifacts/source-revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/release/artifacts/*
          if-no-files-found: error

  # Images are pushed per architecture while building, so the packages are installed and started first.
  smoke:
    needs: packages
    uses: ./.github/workflows/install-smoke.yml

  images:
    needs: [packages, smoke]
    strategy:
      fail-fast: false
      matrix:
        component: [host, worker, updater]
        target:
          - {runner: ubuntu-24.04, platform: linux/amd64, arch: amd64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.component != 'worker'
        with:
          name: release-packages
          path: packages
      - name: Select the matching source and recipe
        id: recipe
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.packages.outputs.version }}
          IMAGE: ${{ needs.packages.outputs.image }}
        run: |
          case "$COMPONENT" in
            host) CONTEXT=.; FILE=deploy/current/Dockerfile; TAG="$IMAGE" ;;
            worker) CONTEXT=.; FILE=docker/next-worker/Dockerfile; TAG="$IMAGE-worker" ;;
            updater) CONTEXT=.; FILE=docker/updater/Dockerfile; TAG="$IMAGE-updater" ;;
          esac
          printf 'context=%s\nfile=%s\ntag=%s\n' "$CONTEXT" "$FILE" "$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: needs.packages.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: needs.packages.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.recipe.outputs.context }}
          file: ${{ steps.recipe.outputs.file }}
          platforms: ${{ matrix.target.platform }}
          build-args: ${{ matrix.component == 'host' && 'PACKAGE_SOURCE=wheel' || '' }}
          build-contexts: ${{ matrix.component != 'worker' && 'release=./packages' || '' }}
          tags: ${{ steps.recipe.outputs.tag }}:${{ needs.packages.outputs.version }}-${{ matrix.target.arch }}
          load: true
          push: false
          labels: |
            org.opencontainers.image.version=${{ needs.packages.outputs.version }}
            io.lenbot.release.revision=${{ github.sha }}
      - name: Check the built component before uploading
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ steps.recipe.outputs.tag }}:${{ needs.packages.outputs.version }}-${{ matrix.target.arch }}
        run: |
          case "$COMPONENT" in
            host) python3 scripts/smoke_install.py docker packages "$RUNNER_TEMP/image-smoke" --image "$TAG" ;;
            worker) docker run --rm --network none --entrypoint pi "$TAG" --version ;;
            updater) docker run --rm --network none --entrypoint python "$TAG" /opt/lenbot-updater/controller.py --help ;;
          esac
          docker save -o "$RUNNER_TEMP/image.tar" "$TAG"
      - name: Push the verified architecture image to both registries
        if: needs.packages.outputs.publish == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ steps.recipe.outputs.tag }}:${{ needs.packages.outputs.version }}-${{ matrix.target.arch }}
          DOCKERHUB: ${{ needs.packages.outputs.dockerhub }}
          VERSION: ${{ needs.packages.outputs.version }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          suffix=''
          if [ "$COMPONENT" != host ]; then suffix="-$COMPONENT"; fi
          python3 scripts/push_release_image.py "$TAG" "$TAG"
          python3 scripts/push_release_image.py "$TAG" "$DOCKERHUB$suffix:$VERSION-$ARCH"
      - uses: actions/upload-artifact@v4
        if: needs.packages.outputs.publish != 'true'
        with:
          name: image-${{ matrix.component }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          if-no-files-found: error

  browser:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        target:
          - {runner: ubuntu-24.04, platform: linux-amd64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15-intel, platform: macos-amd64}
          - {runner: macos-14, platform: macos-arm64}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Read the fixed component tools
        id: tools
        env:
          TARGET_PLATFORM: ${{ matrix.target.platform }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          component = json.loads(Path('deploy/components.json').read_text())['browserskill']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('node', 'pnpm', 'rust'):
                  output.write(f'{name}={component[name]}\n')
              output.write(f'rust_target={component["targets"][os.environ["TARGET_PLATFORM"]]}\n')
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.13'
      - name: Build the exact patched source
        env:
          VERSION: ${{ needs.packages.outputs.version }}
          RUST_VERSION: ${{ steps.tools.outputs.rust }}
          RUST_TARGET: ${{ steps.tools.outputs.rust_target }}
          PNPM_VERSION: ${{ steps.tools.outputs.pnpm }}
        run: |
          tar -xzf "packages/browserskill-$VERSION-source.tar.gz" -C "$RUNNER_TEMP"
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RUST_TARGET"
          npm install --global "pnpm@$PNPM_VERSION"
          cd "$RUNNER_TEMP/browserskill"
          cargo +"$RUST_VERSION" build --locked --release --target "$RUST_TARGET" -p bsk -p bsk-file-host
          pnpm install --frozen-lockfile
          pnpm --filter @browser-skill/extension build
      - name: Package binaries and extension
        env:
          TARGET_PLATFORM: ${{ matrix.target.platform }}
        run: |
          uv run --no-project --python 3.13 python scripts/package_browser.py \
            "$RUNNER_TEMP/browserskill" "$RUNNER_TEMP/browser-artifacts" --platform "$TARGET_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/browser-artifacts/*.tar.gz
          if-no-files-found: error


  publish:
    needs: [packages, images, browser]
    if: needs.packages.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          merge-multiple: true
          path: artifacts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble architecture manifests and record immutable image references
        env:
          IMAGE: ${{ needs.packages.outputs.image }}
          DOCKERHUB: ${{ needs.packages.outputs.dockerhub }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          images = {}
          for registry, base in [('ghcr', os.environ['IMAGE']), ('dockerhub', os.environ['DOCKERHUB'])]:
              images[registry] = {}
              for component, suffix in [('host', ''), ('worker', '-worker'), ('updater', '-updater')]:
                  image = base + suffix
                  tag = image + ':' + os.environ['VERSION']
                  subprocess.run(['docker', 'buildx', 'imagetools', 'create', '-t', tag,
                                  tag + '-amd64', tag + '-arm64'], check=True)
                  result = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', tag,
                                           '--format', '{{json .Manifest}}'], check=True, capture_output=True, text=True)
                  images[registry][component] = image + '@' + json.loads(result.stdout)['digest']
          Path('images.json').write_text(json.dumps(images, indent=2) + '\n')
          PY
          cp images.json artifacts/images.json
          python3 scripts/release_metadata.py artifacts --images images.json
      - name: Publish the existing tag and immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py artifacts
      - name: Update stable image aliases only after the complete Release
        if: needs.packages.outputs.prerelease == 'false'
        env:
          IMAGE: ${{ needs.packages.outputs.image }}
          DOCKERHUB: ${{ needs.packages.outputs.dockerhub }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          for base in "$IMAGE" "$DOCKERHUB"; do
            for suffix in '' '-worker' '-updater'; do
              docker buildx imagetools create -t "$base$suffix:latest" "$base$suffix:$VERSION"
            done
          done
