name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile Python modules
        run: uv run --no-sync python -m compileall -q src/len_bot

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release packages and deployment bundles
        run: uv run --no-project --python 3.13 python scripts/build_release.py "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/release/artifacts/*
          if-no-files-found: error
