name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Compile Python modules
        run: uv run --no-dev python -m compileall -q src/len_bot

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/len_bot/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/len_bot/web/frontend
        run: npm ci --no-audit --no-fund

      - name: Build control panel
        working-directory: src/len_bot/web/frontend
        run: npm run build
