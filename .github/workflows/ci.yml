name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  official-plugins:
    uses: ./.github/workflows/official-plugins.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release packages and deployment bundles
        run: uv run --no-project --python 3.13 python scripts/build_release.py "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/release/artifacts/*
          if-no-files-found: error

  install-smoke:
    needs: build
    uses: ./.github/workflows/install-smoke.yml
